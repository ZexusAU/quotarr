# Example only. Put the secrets in a .env file in the same folder as your compose file:
#   SEERR_API_KEY=...
#   QUOTARR_PASSWORD=...
# Put Quotarr on the same Docker network as Seerr so it can reach http://seerr:5055.

services:
  quotarr:
    image: ghcr.io/zexusau/quotarr:latest
    container_name: quotarr
    restart: unless-stopped
    environment:
      SEERR_URL: http://seerr:5055
      SEERR_API_KEY: ${SEERR_API_KEY}   # or use SEERR_API_KEY_FILE below
      QUOTARR_PASSWORD: ${QUOTARR_PASSWORD}
      POLL_SECONDS: "30"
      TZ: Australia/Sydney
      # WEBHOOK_TOKEN: replace-with-a-random-string    # optional, see README
    # Docker secrets instead of a plain env var:
    #   SEERR_API_KEY_FILE: /run/secrets/seerr_api_key
    # secrets:
    #   - seerr_api_key
    volumes:
      - ./quotarr-data:/data
    ports:
      - "8484:8484"

# secrets:
#   seerr_api_key:
#     file: ./seerr_api_key.txt
